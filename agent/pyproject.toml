[project]
name = "agentlab-agent"
version = "0.1.0"
description = "Agent Lab - a containerised LangGraph pipeline with MCP tools, a memory and traces"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    # langfuse.langchain imports `langchain`, not just langchain-core.
    "langchain>=1.0",
    "psycopg[binary]>=3.2",
    "langfuse>=4.0",
    # The MCP client. 2.x: `mcp.Client` speaks stdio and Streamable HTTP.
    "mcp>=2.2,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
